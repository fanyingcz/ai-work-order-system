# 本地一键起全栈：docker compose up --build
# 访问 http://localhost:8000        （报修端/管理端）
#      http://localhost:8000/worker （工人端）
#      http://localhost:8000/docs   （Swagger）

services:
  db:
    image: mysql:8.0
    # 锁定 8.0：8.4 已移除该参数。native password 让 PyMySQL 免装 cryptography 也能连
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-workorder_demo_pw}
      MYSQL_DATABASE: ${DB_NAME:-AI_Work_Order}
    ports:
      - "3307:3306"   # 宿主用 3307，避免与本机已装的 MySQL 抢 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-workorder_demo_pw}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-workorder_demo_pw}
      DB_NAME: ${DB_NAME:-AI_Work_Order}
      ds_apikey: ${ds_apikey:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
